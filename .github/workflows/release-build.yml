name: Release build

# `release: published` only fires when the release is created with a PAT (or
# manually). release-please uses GITHUB_TOKEN, so release-please dispatches
# this workflow after shipping a version. workflow_dispatch supports re-runs.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch backfills use main; release-please tags match main at ship time.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.release.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        run: make package

      - name: Archive app bundle
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          arch="$(uname -m)"
          zip -r "dist/Speek-${RELEASE_TAG}-darwin-${arch}.zip" dist/Speek.app

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber
